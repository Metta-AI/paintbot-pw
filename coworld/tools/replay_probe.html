<!doctype html>
<meta charset="utf-8">
<title>Polyworld replay acceptance probe</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style>
<iframe title="Replay"></iframe>
<script>
window.replayMessages = [];
const frame = document.querySelector('iframe');
window.addEventListener('message', event => {
  if (event.source === frame.contentWindow && event.data?.src === 'coworld-replay') {
    window.replayMessages.push(event.data);
  }
});
frame.src = new URLSearchParams(location.search).get('viewer');
</script>
