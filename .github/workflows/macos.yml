# macOS build: the same steps as build.yml, run on macOS only. It runs on every push and PR
# but is kept out of the "Github Actions" workflow that deploy.yml waits on, so the slower
# macOS shards never delay a release. A red macOS run still shows on the commit and the PR.
name: macOS build
on:
  workflow_dispatch:
jobs:
  macos:
    uses: ./.github/workflows/build.yml
    with:
      os: '["macos-latest"]'
