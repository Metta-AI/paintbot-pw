name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: polyworld
    steps:
      - uses: actions/checkout@v5
        with:
          path: polyworld
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "polyworld/polyworld.nimble"
          nimby sync "polyworld/nimby.lock"
      - run: nim r tests/tests.nim
      - run: >-
          nim r -d:profileTracePath=tmp/profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: >-
          nim r -d:mapProfileTracePath=tmp/map-profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: nim r tests/test_gota_sim.nim -- --bot:examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless tests/test_recordings.nim --bot examples/call_to_adventure/players/base.bas:4
      - run: nim r -d:headless -d:recordGota tests/test_recordings.nim --bot examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless -d:recordHlf tests/test_recordings.nim --bot examples/heartleaf/players/base.bas:9
      - run: nim r -d:headless -d:recordLvd tests/test_recordings.nim --bot examples/light_vs_dark/players/base.bas:2
      - run: nim c -d:headless examples/gods_of_the_arena/gota.nim
      - run: nim c -d:headless examples/call_to_adventure/cta.nim
      - run: nim c -d:headless examples/light_vs_dark/lvd.nim
      - run: nim c -d:headless examples/heartleaf/heartleaf.nim
      - run: nim r tests/test_paintbot_respawns.nim
      - run: nim r tests/test_paintbot_barrage.nim
      - run: nim r tests/test_paintbot_scoring.nim
      - run: nim r tests/test_paintbot_human.nim
      - run: nim r tests/test_paintbot_replay.nim
      - run: node tests/test_paintbot_webinputs.js
