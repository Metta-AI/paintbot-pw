# To add a new CI test, add it to tests/ci_tests.txt, not to this file.
#
# Every test command lives in tests/ci_tests.txt. Each OS runs the list split across SHARDS
# parallel jobs; tests/run_ci_shard.py assigns commands to shards by greedy longest-first bin
# packing over tests/ci_durations.json, runs its shard 2 or 3 commands at a time (longest first;
# `serial` commands alone), keeps going after a failure, and fails the job at the end if any
# command failed.
name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    # PRs that change only *.md files (outside .github/) skip CI: no code or test reads a .md
    # file. Pushes to main are NOT filtered: deploy.yml runs after this workflow passes on main,
    # and its plan expects every main commit to get a build. `paths` with `!` rather than
    # paths-ignore, so the later .github/** entry re-includes workflow docs.
    paths:
      - '**'
      - '!**/*.md'
      - '.github/**'
  workflow_dispatch:
  # macos.yml and windows.yml reuse these steps for macOS and Windows. They run separately so
  # that deploy.yml, which triggers when this workflow ("Github Actions") passes on main, waits
  # only for the Linux build: the hosted game runs on Linux. Windows is about 15 minutes slower
  # and its setup-nim step flakes; macOS shards run about 1.5x the Linux ones (run 36373503069:
  # slowest 383 s against 216 s). Both still report on every commit and PR.
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to build on.
        required: false
        type: string
      shards:
        description: JSON list of shard indexes, 0..N-1 (N shards per OS). Default 8.
        required: false
        type: string
      jobs:
        description: Commands each shard runs at once. Default 2.
        required: false
        type: number
jobs:
  build:
    name: build (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest"]') }}
        # Per OS (measured warm on #132): Linux 8 shards x 2 commands at once = 2.3 min, against
        # 3.1 min for 4 x 3 at the same runner-minutes. macos.yml passes 4 x 3: the org's macOS
        # runners are few, so more macOS shards only queue. windows.yml passes 4 x 1 (Windows has
        # no per-command nimcache, see run_ci_shard.command_env).
        shard: ${{ fromJSON(inputs.shards || '[0, 1, 2, 3, 4, 5, 6, 7]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: polyworld
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: polyworld
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "polyworld/polyworld.nimble"
          nimby sync "polyworld/nimby.lock"
      # Nim's cache (generated C and object files) is kept between runs. The runner gives every
      # nim command its own directory under CI_NIMCACHE_ROOT (via XDG_CACHE_HOME), so builds with
      # different flags never share objects, and the key is per OS, Nim version, nimby.lock,
      # shard and command set. Nim recompiles a C file only when its content hash changes, so a
      # warm cache cuts compile time without changing what any test runs. Restored on every run;
      # saved only from pushes to main, so PR builds cannot write it. Windows builds uncached.
      - name: Nim version and shard count
        id: nim
        shell: bash
        env:
          SHARDS: ${{ inputs.shards || '[0, 1, 2, 3, 4, 5, 6, 7]' }}
        run: |
          echo "version=$(nim --version | head -1 | awk '{print $4}')" >> "$GITHUB_OUTPUT"
          echo "of=$(python -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$SHARDS")" >> "$GITHUB_OUTPUT"
      - name: Restore nimcache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/nimcache
          key: nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of${{ steps.nim.outputs.of }}-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of${{ steps.nim.outputs.of }}-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-
            nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of${{ steps.nim.outputs.of }}-
      - name: Check shard plan
        run: python tests/run_ci_shard.py --check --of ${{ steps.nim.outputs.of }}
      - name: Run shard ${{ matrix.shard }} of ${{ steps.nim.outputs.of }}
        # Without a per-command nimcache (Windows) the runner runs one command at a time anyway.
        run: python tests/run_ci_shard.py --shard ${{ matrix.shard }} --of ${{ steps.nim.outputs.of }} --jobs ${{ inputs.jobs || 2 }}
        env:
          CI_NIMCACHE_ROOT: ${{ github.workspace }}/nimcache
      - name: Save nimcache
        if: >-
          !cancelled() && runner.os != 'Windows' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/nimcache
          key: nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of${{ steps.nim.outputs.of }}-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
