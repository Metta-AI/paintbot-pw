# To add a new CI test, add it to tests/ci_tests.txt, not to this file.
#
# Every test command lives in tests/ci_tests.txt. Each OS runs the list split across SHARDS
# parallel jobs; tests/run_ci_shard.py assigns commands to shards by greedy longest-first bin
# packing over tests/ci_durations.json, runs its shard 3 commands at a time (longest first;
# `serial` commands alone), keeps going after a failure, and fails the job at the end if any
# command failed.
name: Github Actions
on:
  workflow_dispatch:
  # macos.yml and windows.yml reuse these steps for macOS and Windows. They run separately so
  # that deploy.yml, which triggers when this workflow ("Github Actions") passes on main, waits
  # only for the Linux build: the hosted game runs on Linux. Windows is about 15 minutes slower
  # and its setup-nim step flakes; macOS shards run about 1.5x the Linux ones (run 36373503069:
  # slowest 383 s against 216 s). Both still report on every commit and PR.
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to build on.
        required: false
        type: string
jobs:
  build:
    name: build (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest"]') }}
        # SHARDS = 4, keep this list and every "of4"/--of 4 below in sync. Each shard runs 3
        # commands at once (--jobs 3; hosted runners have 3-4 cores and most tests use one), so
        # four shards finish in about as long as their longest command. More shards would mostly
        # add queueing on macOS (macos.yml), whose org runners are the bottleneck.
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: polyworld
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: polyworld
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "polyworld/polyworld.nimble"
          nimby sync "polyworld/nimby.lock"
      # Nim's cache (generated C and object files) is kept between runs. The runner gives every
      # nim command its own directory under CI_NIMCACHE_ROOT (via XDG_CACHE_HOME), so builds with
      # different flags never share objects, and the key is per OS, Nim version, nimby.lock,
      # shard and command set. Nim recompiles a C file only when its content hash changes, so a
      # warm cache cuts compile time without changing what any test runs. Restored on every run;
      # saved only from pushes to main, so PR builds cannot write it. Windows builds uncached.
      - name: Nim version
        id: nim
        if: runner.os != 'Windows'
        shell: bash
        run: echo "version=$(nim --version | head -1 | awk '{print $4}')" >> "$GITHUB_OUTPUT"
      - name: Restore nimcache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/nimcache
          key: nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of4-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of4-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-
            nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of4-
      - name: Check shard plan
        run: python tests/run_ci_shard.py --check --of 4
      - name: Run shard ${{ matrix.shard }} of 4
        # Windows has no per-command nimcache (see run_ci_shard.command_env), so it runs one
        # command at a time; the runner also falls back to that on its own.
        run: python tests/run_ci_shard.py --shard ${{ matrix.shard }} --of 4 --jobs ${{ runner.os == 'Windows' && 1 || 3 }}
        env:
          CI_NIMCACHE_ROOT: ${{ github.workspace }}/nimcache
      - name: Save nimcache
        if: >-
          !cancelled() && runner.os != 'Windows' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/nimcache
          key: nimcache-v1-${{ runner.os }}-nim${{ steps.nim.outputs.version }}-${{ hashFiles('polyworld/nimby.lock') }}-shard${{ matrix.shard }}of4-${{ hashFiles('polyworld/tests/ci_tests.txt', 'polyworld/tests/ci_durations.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
