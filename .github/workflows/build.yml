name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: polyworld
    steps:
      - uses: actions/checkout@v5
        with:
          path: polyworld
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "polyworld/polyworld.nimble"
          nimby sync "polyworld/nimby.lock"
      - run: nim r tests/tests.nim
      - run: >-
          nim r -d:profileTracePath=tmp/profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: >-
          nim r -d:mapProfileTracePath=tmp/map-profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: nim r tests/test_gota_sim.nim -- --bot:examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless tests/test_recordings.nim --bot examples/call_to_adventure/players/base.bas:4
      - run: nim r -d:headless -d:recordGota tests/test_recordings.nim --bot examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless -d:recordHlf tests/test_recordings.nim --bot examples/heartleaf/players/base.bas:9
      - run: nim r -d:headless -d:recordLvd tests/test_recordings.nim --bot examples/light_vs_dark/players/base.bas:2
      - run: nim c -d:headless examples/gods_of_the_arena/gota.nim
      - run: nim c -d:headless examples/call_to_adventure/cta.nim
      - run: nim c -d:headless examples/light_vs_dark/lvd.nim
      - run: nim c -d:headless examples/heartleaf/heartleaf.nim
      - run: nim r tests/test_paintbot_river.nim
      - run: nim r tests/test_paintbot_respawns.nim
      - run: nim r tests/test_paintbot_barrage.nim
      - run: nim r tests/test_paintbot_scoring.nim
      - run: nim r tests/test_paintbot_heart_meter.nim
      - run: nim r tests/test_paintbot_elimination.nim
      - run: nim r tests/test_paintbot_celebration.nim
      - run: nim r tests/test_paintbot_capture.nim
      - run: nim r tests/test_paintbot_big_hearts.nim
      - run: nim r tests/test_paintbot_sound.nim
      - run: nim r tests/test_paintbot_heart_spawns.nim
      - run: nim r tests/test_paintbot_uniform.nim
      - run: nim r tests/test_paintbot_human.nim
      - run: nim r tests/test_paintbot_replay.nim
      - run: nim r -d:headless tests/test_paintbot_live_rules.nim --bot:examples/paintbot/players/base.bas:16
      - run: nim r tests/test_paintbot_oracle.nim
      - run: nim r tests/test_paintbot_glory.nim
      - run: nim r tests/test_paintbot_glory_hearts.nim
      - run: nim r tests/test_paintbot_glory_behind.nim
      - run: nim r tests/test_paintbot_projection.nim
      - run: nim r -d:headless tests/test_paintbot_neural_contract.nim
      - run: nim r -d:headless tests/test_paintbot_neural_obs_v2.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_env.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_geometry_cache.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_seat_stats.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_scripts.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_curriculum.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_contract_v2.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_fire_hold.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_fire_hold_radius.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_sampling.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_river_strafe.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_snap_steady.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_retarget_gate.nim
      - run: nim r --mm:arc --threads:on -d:pwTraining tests/test_paintbot_native_obs_v2.nim
      - run: nim r -d:headless tests/test_paintbot_neural_host.nim
      - run: python -m unittest discover -s coworld/paintbot -p test_neural_package.py
      - run: nim r tests/test_paintbot_jev_baseline.nim
      - run: node tests/test_paintbot_inspector.js
      - run: node tests/test_paintbot_webinputs.js
      - run: python coworld/paintbot/tools/make_jev_baseline.py --check
      # The hosted runtime is Linux-only; its file-URI handling is POSIX, so skip Windows here.
      - run: python -m unittest test_runtime
        if: runner.os != 'Windows'
        working-directory: polyworld/coworld/paintbot
      - run: python coworld/paintbot/test_training_bridge.py
        if: runner.os != 'Windows'
