# To add a new CI test, add it to tests/ci_tests.txt, not to this file.
#
# Every test command lives in tests/ci_tests.txt. Each OS runs the list split across SHARDS
# parallel jobs; tests/run_ci_shard.py assigns commands to shards by greedy longest-first bin
# packing over tests/ci_durations.json, runs its shard in manifest order, keeps going after a
# failure, and fails the job at the end if any command failed.
name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  # windows.yml reuses these steps for Windows. Windows runs separately so that deploy.yml,
  # which triggers when this workflow ("Github Actions") passes on main, waits only for the
  # Linux and macOS builds. The hosted game runs on Linux; Windows is about 15 minutes slower
  # and its setup-nim step flakes, so it no longer holds up a release.
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to build on.
        required: false
        type: string
jobs:
  build:
    name: build (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "macos-latest"]') }}
        # SHARDS = 5: keep this list and the --of below in sync. Five puts every shard at about
        # 5 minutes of tests on ubuntu-latest (setup and install add about 10 s).
        shard: [0, 1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: polyworld
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: polyworld
      - uses: treeform/setup-nim-action@v6
      # Nim's build cache (generated C, objects, binaries). Nim decides what to recompile by
      # content hash, not timestamp, so a restored cache is safe: a stale entry just recompiles.
      # One cache line per OS and shard, since each shard compiles different tests. The key ends
      # in the commit so every run saves; restore takes the newest entry for the same OS, shard
      # and dependency lock. Windows keeps it in ~/nimcache, everywhere else in ~/.cache/nim.
      - name: Restore Nim build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
            ~/nimcache
          key: nimcache-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('polyworld/nimby.lock', 'polyworld/polyworld.nimble') }}-${{ github.sha }}
          restore-keys: |
            nimcache-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('polyworld/nimby.lock', 'polyworld/polyworld.nimble') }}-
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "polyworld/polyworld.nimble"
          nimby sync "polyworld/nimby.lock"
      - name: Check shard plan
        run: python tests/run_ci_shard.py --check --of 5
      - name: Run shard ${{ matrix.shard }} of 5
        run: python tests/run_ci_shard.py --shard ${{ matrix.shard }} --of 5
