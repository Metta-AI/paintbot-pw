# Windows build: the same steps as build.yml, run on Windows only. It runs on every push and PR
# but is kept out of the "Github Actions" workflow that deploy.yml waits on, so a slow or flaky
# Windows run never delays a release. A red Windows run still shows on the commit and the PR.
name: Windows build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    # PRs that change only *.md files (outside .github/) skip CI: no code or test reads a .md
    # file. Pushes to main are NOT filtered: deploy.yml runs after this workflow passes on main,
    # and its plan expects every main commit to get a build. `paths` with `!` rather than
    # paths-ignore, so the later .github/** entry re-includes workflow docs.
    paths:
      - '**'
      - '!**/*.md'
      - '.github/**'
  workflow_dispatch:
jobs:
  windows:
    uses: ./.github/workflows/build.yml
    with:
      os: '["windows-latest"]'
      shards: '[0, 1, 2, 3]'
      jobs: 1
