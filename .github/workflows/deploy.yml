# Deploy the paintbot-pw Coworld: coworld build -> coworld certify -> (optional) coworld upload-coworld.
#
# Destination: Metta-AI/paintbot-pw/.github/workflows/deploy.yml
#
# Required repository secrets:
#   POLYWORLD_DATA_DEPLOY_KEY  read-only SSH deploy key for the PRIVATE repo Metta-AI/polyworld-data.
#                              Needed even for dry runs: the replay-viewer build hook
#                              (coworld/paintbot/tools/build_replay_viewer.sh) compiles the viewer
#                              with emscripten and preloads art from that repo, pinned in
#                              coworld/assets.json. `coworld build` always runs that hook.
#   SOFTMAX_TOKEN              Softmax platform bearer token. Only read when dry_run is false.
#
# Triggers: a manual dispatch (version typed in, dry run by default), or automatically when
# build.yml ("Github Actions") passes on a push to main. The automatic path deploys the next
# platform version unless every file changed since the last deploy is outside the shipped game
# (tests, CI, the deploy log, the other Polyworld games). Every successful upload tags the
# commit it shipped as coworld-v<version>; the newest such tag is "the last deploy".
#
# Layout mirrors build.yml: this repo is checked out into ./paintbot-pw so the art repo can sit
# beside it at ./polyworld_data, which is where the hook and build_round_village.py look for it
# (build_round_village.py hard-codes <repo>/../polyworld_data and ignores POLYWORLD_DATA).
name: Deploy Coworld
# The display title carries the inputs (the runs API does not expose them), so the duplicate
# guard below and `gh run list` can tell "0.3.36 upload" from "0.3.36 dry run" without opening logs.
# Automatic runs are titled by commit; their version is only known once the platform is asked.
run-name: "${{ github.event_name == 'workflow_run' && format('Deploy Coworld auto @{0}', github.event.workflow_run.head_sha) || format('Deploy Coworld {0} ({1})', inputs.version, inputs.dry_run && 'dry run' || 'upload') }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Coworld version to build, e.g. 0.3.20. Must be newer than the latest uploaded paintbot-pw."
        required: true
        type: string
      dry_run:
        description: "Build and certify only (no upload, no Softmax token used)."
        required: false
        default: true
        type: boolean
  workflow_run:
    workflows: ["Github Actions"] # build.yml
    types: [completed]
    branches: [main]

permissions:
  contents: write # read the tree, and push the coworld-v<version> tag after an upload
  actions: read # to confirm build.yml passed on this commit before a real upload

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  COWORLD_CLI_VERSION: "0.1.47" # PyPI `coworld`; pinned so CI never depends on a metta checkout
  COWORLD_NAME: paintbot-pw
  COWORLD_PROJECT: coworld/paintbot
  NIM_VERSION: "2.2.10" # matches coworld/paintbot/Dockerfile and coworld/integration.md
  EMSDK_VERSION: "4.0.15" # paintbot-pw pins no emsdk; same pin as cogame-parley's viewer build
  SOFTMAX_API_SERVER: https://softmax.com/api

jobs:
  # Decides whether and what to deploy. The workflow-level concurrency group serializes whole
  # runs, so the last-deploy tag read here is never stale behind an upload still in flight.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      sha: ${{ steps.plan.outputs.sha }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            { echo "deploy=true"; echo "sha=$GITHUB_SHA"; echo "dry_run=$DRY_RUN"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$RUN_SHA"
          { echo "sha=$sha"; echo "dry_run=false"; } >> "$GITHUB_OUTPUT"
          # A newer commit on main gets its own build and its own run; deploying this older one
          # first would only be superseded, so leave it to the newer run.
          head="$(git rev-parse origin/main)"
          if [ "$head" != "$sha" ]; then
            echo "main moved on to $head; its own build deploys it. Skipping $sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last="$(git tag -l 'coworld-v*' --sort=-v:refname | head -1)"
          if [ -z "$last" ]; then
            echo "No coworld-v* tag yet; deploying $sha."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="$(git rev-list -n 1 "$last")"
          if [ "$base" = "$sha" ]; then
            echo "$sha is already deployed as $last."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paths that never reach the paintbot-pw image or its manifest (tools/slurm/ holds cluster
          # job scripts). Anything else deploys.
          ignore='^(tests/|\.github/|coworld/paintbot/DEPLOYMENT\.md$|examples/(call_to_adventure|gods_of_the_arena|heartleaf|light_vs_dark)/|coworld/(cta|gota|lvd)/|tools/slurm/)'
          shipped="$(git diff --name-only "$base" "$sha" | grep -Ev "$ignore" || true)"
          if [ -z "$shipped" ]; then
            echo "Nothing shipped changed since $last ($base); not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed since $last:"; echo "$shipped"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Manual runs name the version; automatic runs take the platform's next version (set below).
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      SHA: ${{ needs.plan.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: paintbot-pw
    steps:
      - uses: actions/checkout@v5
        with:
          path: paintbot-pw
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Validate inputs
        env:
          POLYWORLD_DATA_DEPLOY_KEY: ${{ secrets.POLYWORLD_DATA_DEPLOY_KEY }}
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::version must be dotted numbers (e.g. 0.3.20), got: $VERSION"
            exit 1
          fi
          if [ -z "$POLYWORLD_DATA_DEPLOY_KEY" ]; then
            echo "::error::POLYWORLD_DATA_DEPLOY_KEY secret is not set. The replay viewer cannot be built without Metta-AI/polyworld-data."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Real uploads must run from main (got $GITHUB_REF). Use dry_run for other refs."
              exit 1
            fi
            if [ -z "$SOFTMAX_TOKEN" ]; then
              echo "::error::SOFTMAX_TOKEN secret is not set; required when dry_run is false."
              exit 1
            fi
          fi
          echo "Deploying $COWORLD_NAME ${VERSION:-<next>} from $SHA (dry_run=$DRY_RUN, $GITHUB_EVENT_NAME)"

      # 2026-09-22: two sessions dispatched 0.3.36 for the same SHA (d529636) within minutes
      # (dry runs 35776537613 19:52Z and 35776637751 19:53Z, then uploads 35776950564 19:55Z and
      # 35777253640 19:58Z). The concurrency group only serializes; the second upload ran to the
      # platform's next-version check and failed there, which was the only thing stopping a
      # duplicate 0.3.36/0.3.37. This step refuses it here, from the run list alone. Dry runs
      # upload nothing, so they never block and are never blocked. A real upload fails when a
      # real upload of the same SHA and version is ahead of it (created earlier, not completed),
      # or completed successfully in the last 30 minutes. A later queued duplicate does not fail
      # this run: it fails itself when its turn comes and it sees this run's success. Runs from
      # before this title format have the bare title "Deploy Coworld" and are not matched.
      # Automatic runs cannot duplicate: the concurrency group serializes them and the plan job
      # skips a commit the newest coworld-v* tag already points at.
      - name: Refuse a duplicate upload of this SHA and version
        if: ${{ github.event_name == 'workflow_dispatch' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Deploy Coworld $VERSION (upload)"
          mine="$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq .createdAt)"
          gh run list --workflow deploy.yml --commit "$GITHUB_SHA" --limit 100 \
            --json databaseId,displayTitle,status,conclusion,createdAt,updatedAt > "$RUNNER_TEMP/deploy-runs.json"
          dup="$(jq -r --arg title "$title" --arg me "$GITHUB_RUN_ID" --arg mine "$mine" '
            map(select(.displayTitle == $title and (.databaseId | tostring) != $me))
            | map(select(
                (.status != "completed" and .createdAt < $mine)
                or (.conclusion == "success" and (now - (.updatedAt | fromdateiso8601)) < 1800)))
            | .[] | "\(.databaseId) \(.status)/\(.conclusion // "-") created \(.createdAt)"' \
            "$RUNNER_TEMP/deploy-runs.json")"
          if [ -n "$dup" ]; then
            echo "::error::another upload of $COWORLD_NAME $VERSION from $GITHUB_SHA is in flight ahead of this run or succeeded in the last 30 minutes; not uploading twice:"
            echo "$dup"
            exit 1
          fi
          echo "No other upload of $VERSION from $GITHUB_SHA is in flight or recently succeeded."

      - name: Require green build.yml on this commit
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          if [ "$runs" = "0" ]; then
            echo "::error::build.yml has no successful run for $SHA. Wait for CI to pass (or use dry_run)."
            exit 1
          fi

      - name: Read pinned Polyworld art revision
        id: assets
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          assets = json.load(open("coworld/assets.json"))
          assert assets["repository"].rstrip("/").removesuffix(".git").endswith("Metta-AI/polyworld-data"), assets
          print(f"revision={assets['revision']}")
          PY

      - name: Check out Polyworld art (private, pinned)
        uses: actions/checkout@v5
        with:
          repository: Metta-AI/polyworld-data
          ref: ${{ steps.assets.outputs.revision }}
          path: polyworld_data
          ssh-key: ${{ secrets.POLYWORLD_DATA_DEPLOY_KEY }}
          persist-credentials: false

      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Sync pinned Nim dependencies
        run: |
          set -euo pipefail
          export POLYWORLD_DEPS="$GITHUB_WORKSPACE/paintbot-pw/tmp/coworld/deps"
          python3 coworld/tools/sync_dependencies.py

      - name: Install emsdk
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - uses: astral-sh/setup-uv@v6

      - name: Install coworld CLI
        run: |
          set -euo pipefail
          uv tool install --python 3.12 "coworld==${COWORLD_CLI_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/coworld" --help >/dev/null

      # Credentials are materialised before the long build so a bad token fails in seconds.
      # The CLI (softmax.auth, softmax-cli 0.26.34) reads ~/.softmax/credentials.yaml with
      # yaml.safe_load and looks up tokens["https://softmax.com/api"]. JSON is valid YAML, and
      # json.dump quotes any token characters. The token only travels via env, never argv/stdout.
      - name: Write Softmax credentials
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          token = os.environ["SOFTMAX_TOKEN"].strip()
          server = os.environ["SOFTMAX_API_SERVER"].rstrip("/")
          path = pathlib.Path.home() / ".softmax" / "credentials.yaml"
          path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump({"tokens": {server: token}}, f)
          os.chmod(path, 0o600)
          PY

      - name: Check token and version against the platform
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          next="$(coworld next-version "$COWORLD_NAME" --server "$SOFTMAX_API_SERVER")"
          echo "Platform suggests next version: $next"
          if [ -z "$VERSION" ]; then
            VERSION="$next"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Automatic deploy: using $VERSION"
          fi
          "$(uv tool dir)/coworld/bin/python" - "$VERSION" "$next" <<'PY'
          import sys
          from packaging.version import Version
          requested, suggested = map(Version, sys.argv[1:])
          if requested < suggested:
              sys.exit(f"::error::version {requested} is not newer than the latest uploaded version (next is {suggested})")
          PY

      - name: coworld build
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          export POLYWORLD_DATA="$GITHUB_WORKSPACE/polyworld_data"
          export POLYWORLD_DEPS="$GITHUB_WORKSPACE/paintbot-pw/tmp/coworld/deps"
          command -v emcc nim docker python3
          coworld build --project "$COWORLD_PROJECT" --version "$VERSION"
          test -f "$COWORLD_PROJECT/dist/replay-viewer/index.html"

      - name: coworld certify
        run: |
          set -euo pipefail
          coworld certify "$COWORLD_PROJECT/dist/coworld_manifest.json" \
            --no-open-report --timeout-seconds 900 2>&1 | tee "$RUNNER_TEMP/certify.log"
          grep -q "^Certified " "$RUNNER_TEMP/certify.log"
          grep -q "Replay liveness: skipped (static replay bundle declared" "$RUNNER_TEMP/certify.log"

      - name: coworld upload-coworld
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          # Exit 2 = certification failure we control; exit 3 = platform failure/timeout (retryable).
          coworld upload-coworld "$COWORLD_PROJECT/dist/coworld_manifest.json" \
            --server "$SOFTMAX_API_SERVER" \
            --timeout-seconds 900 \
            --wait-hosted-smoke --hosted-smoke-timeout-seconds 1800 \
            --wait-certification --certification-timeout-seconds 1800 \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Verify canonical promotion
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          cow_id="$(sed -n 's/^Coworld: \(cow_[0-9a-f-]*\)$/\1/p' "$RUNNER_TEMP/upload.log" | tail -1)"
          if [ -z "$cow_id" ]; then
            echo "::error::could not find the uploaded Coworld id in the upload log"
            exit 1
          fi
          for attempt in $(seq 1 20); do
            if coworld status "$cow_id" --json --server "$SOFTMAX_API_SERVER" \
              | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["coworld"]["canonical"] else 1)'; then
              echo "$COWORLD_NAME $cow_id is canonical"
              echo "Uploaded \`$COWORLD_NAME\` as \`$cow_id\` (canonical)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "not canonical yet (attempt $attempt/20)"
            sleep 15
          done
          echo "::error::$cow_id uploaded but is not canonical"
          exit 1

      # The automatic path diffs against the newest coworld-v* tag, so every upload records one.
      - name: Tag the deployed commit
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/coworld-v$VERSION" -f sha="$SHA" >/dev/null
          echo "Tagged $SHA as coworld-v$VERSION"
          echo "Tagged \`$SHA\` as \`coworld-v$VERSION\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Softmax credentials
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$HOME/.softmax/credentials.yaml"

      - name: Keep manifest and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coworld-${{ env.VERSION || 'auto' }}
          # Deliberately not the replay-viewer bundle: it embeds art from the private polyworld-data repo.
          path: |
            paintbot-pw/coworld/paintbot/dist/coworld_manifest.json
            ${{ runner.temp }}/certify.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
