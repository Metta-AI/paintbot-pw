<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Polyworld demo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      .stack {
        display: flex;
        flex-direction: row;
        height: 100%;
      }
      .panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #2a2a2a;
      }
      .panel:first-child {
        border-left: none;
      }
      .panel iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!--
      Serve from the polyworld repo root so the wasm bundles and bots resolve:
        python3 -m http.server 8766 --bind 127.0.0.1
      Then open /tools/demo/
    -->
    <div class="stack">
      <div class="panel">
        <iframe
          title="Gods of the Arena"
          allow="fullscreen; autoplay; gamepad"
          src="../../examples/gods_of_the_arena/emscripten/gota.html?bot=../players/base.bas:10"
        ></iframe>
      </div>
      <div class="panel">
        <iframe
          title="Light vs Dark"
          allow="fullscreen; autoplay; gamepad"
          src="../../examples/light_vs_dark/emscripten/lvd.html?bot=../players/base.bas:2"
        ></iframe>
      </div>
      <div class="panel">
        <iframe
          title="Call to Adventure"
          allow="fullscreen; autoplay; gamepad"
          src="../../examples/call_to_adventure/emscripten/cta.html?bot=../players/base.bas:4"
        ></iframe>
      </div>
    </div>
  </body>
</html>
